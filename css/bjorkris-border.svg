<line x1="2" y1="52"  x2="0" y2="48"  stroke="#cdbf9a" stroke-width="0.55"/>
<line x1="2" y1="52"  x2="0" y2="55"  stroke="#cdbf9a" stroke-width="0.55"/>
<line x1="2" y1="97"  x2="0" y2="93"  stroke="#cdbf9a" stroke-width="0.55"/>
<line x1="2" y1="97"  x2="0" y2="100" stroke="#cdbf9a" stroke-width="0.55"/>
<line x1="2" y1="145" x2="0" y2="141" stroke="#cdbf9a" stroke-width="0.55"/>
<line x1="2" y1="145" x2="0" y2="148" stroke="#cdbf9a" stroke-width="0.55"/>
<line x1="2" y1="193" x2="0" y2="189" stroke="#cdbf9a" stroke-width="0.55"/>
<line x1="2" y1="193" x2="0" y2="196" stroke="#cdbf9a" stroke-width="0.55"/>
<line x1="2" y1="239" x2="0" y2="235" stroke="#cdbf9a" stroke-width="0.55"/>
<line x1="2" y1="239" x2="0" y2="242" stroke="#cdbf9a" stroke-width="0.55"/>
<!-- Löv på vänstergrenar -->
<use href="#lv"   transform="translate(0,48)  rotate(90)"/>
<use href="#lv-s" transform="translate(0,55.5) rotate(80)"/>
<use href="#lv"   transform="translate(0,93)  rotate(95)"/>
<use href="#lv-s" transform="translate(0,100.5) rotate(82)"/>
<use href="#lv"   transform="translate(0,141) rotate(90)"/>
<use href="#lv-s" transform="translate(0,148.5) rotate(83)"/>
<use href="#lv"   transform="translate(0,189) rotate(92)"/>
<use href="#lv-s" transform="translate(0,196.5) rotate(80)"/>
<use href="#lv"   transform="translate(0,235) rotate(90)"/>
<use href="#lv-s" transform="translate(0,242.5) rotate(85)"/>

<!-- ═══════════════════════════════════════════
     HÖGER KANT
═══════════════════════════════════════════ -->
