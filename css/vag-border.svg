<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297">
<!--
  VÅG — mjuka vågmönster längs alla 4 kanter
  Färgschema: calm teal/sea (#5a8a8a main, #7aabab lighter, #3a6a6a darker)
  Konvention: alla dekorationer inom 10mm från sidkanten.
  Sinusvågor med små prickar vid vågkrön.
-->
<defs>
  <!-- Prick vid vågkrön -->
  <circle id="wd" r="0.8" fill="#3a6a6a"/>
  <!-- Liten prick -->
  <circle id="wd-s" r="0.5" fill="#7aabab"/>
</defs>

<!-- TUNN BORDERRAM -->
<rect x="10" y="10" width="190" height="277"
  fill="none" stroke="#5a8a8a" stroke-width="0.5"/>

<!-- ═══════════════════════════════════════════
     TOP KANT — horisontell sinusvåg
═══════════════════════════════════════════ -->
<path d="M10,6 C25,2 35,9 50,5 C65,1 75,9 90,5 C105,1 115,9 130,5 C145,1 155,9 170,5 C185,1 195,9 200,6"
  fill="none" stroke="#5a8a8a" stroke-width="0.7" stroke-linecap="round"/>
<path d="M10,7.5 C25,4 35,10.5 50,6.5 C65,2.5 75,10.5 90,6.5 C105,2.5 115,10.5 130,6.5 C145,2.5 155,10.5 170,6.5 C185,2.5 195,10.5 200,7.5"
  fill="none" stroke="#7aabab" stroke-width="0.4" stroke-linecap="round" opacity="0.6"/>
<!-- Prickar vid vågkrön (top) -->
<use href="#wd"   transform="translate(50,5)"/>
<use href="#wd-s" transform="translate(30,8)"/>
<use href="#wd"   transform="translate(90,5)"/>
<use href="#wd-s" transform="translate(70,8)"/>
<use href="#wd"   transform="translate(130,5)"/>
<use href="#wd-s" transform="translate(110,8)"/>
<use href="#wd"   transform="translate(170,5)"/>
<use href="#wd-s" transform="translate(150,8)"/>

<!-- ═══════════════════════════════════════════
     BOTTOM KANT — horisontell sinusvåg
═══════════════════════════════════════════ -->
<path d="M10,291 C25,295 35,288 50,292 C65,296 75,288 90,292 C105,296 115,288 130,292 C145,296 155,288 170,292 C185,296 195,288 200,291"
  fill="none" stroke="#5a8a8a" stroke-width="0.7" stroke-linecap="round"/>
<path d="M10,289.5 C25,293.5 35,286.5 50,290.5 C65,294.5 75,286.5 90,290.5 C105,294.5 115,286.5 130,290.5 C145,294.5 155,286.5 170,290.5 C185,294.5 195,286.5 200,289.5"
  fill="none" stroke="#7aabab" stroke-width="0.4" stroke-linecap="round" opacity="0.6"/>
<!-- Prickar vid vågkrön (bottom) -->
<use href="#wd"   transform="translate(50,292)"/>
<use href="#wd-s" transform="translate(30,289)"/>
<use href="#wd"   transform="translate(90,292)"/>
<use href="#wd-s" transform="translate(70,289)"/>
<use href="#wd"   transform="translate(130,292)"/>
<use href="#wd-s" transform="translate(110,289)"/>
<use href="#wd"   transform="translate(170,292)"/>
<use href="#wd-s" transform="translate(150,289)"/>

<!-- ═══════════════════════════════════════════
     VÄNSTER KANT — vertikal sinusvåg
═══════════════════════════════════════════ -->
<path d="M6,10 C2,30 9,50 5,70 C1,90 9,110 5,130 C1,150 9,170 5,190 C1,210 9,230 5,250 C1,270 6,280 6,287"
  fill="none" stroke="#5a8a8a" stroke-width="0.7" stroke-linecap="round"/>
<path d="M7.5,10 C3.5,30 10.5,50 6.5,70 C2.5,90 10.5,110 6.5,130 C2.5,150 10.5,170 6.5,190 C2.5,210 10.5,230 6.5,250 C2.5,270 7.5,280 7.5,287"
  fill="none" stroke="#7aabab" stroke-width="0.4" stroke-linecap="round" opacity="0.6"/>
<!-- Prickar vid vågkrön (left) -->
<use href="#wd"   transform="translate(5,70)"/>
<use href="#wd-s" transform="translate(8,50)"/>
<use href="#wd"   transform="translate(5,130)"/>
<use href="#wd-s" transform="translate(8,110)"/>
<use href="#wd"   transform="translate(5,190)"/>
<use href="#wd-s" transform="translate(8,170)"/>
<use href="#wd"   transform="translate(5,250)"/>
<use href="#wd-s" transform="translate(8,230)"/>

<!-- ═══════════════════════════════════════════
     HÖGER KANT — vertikal sinusvåg
═══════════════════════════════════════════ -->
<path d="M204,10 C208,30 201,50 205,70 C209,90 201,110 205,130 C209,150 201,170 205,190 C209,210 201,230 205,250 C209,270 204,280 204,287"
  fill="none" stroke="#5a8a8a" stroke-width="0.7" stroke-linecap="round"/>
<path d="M202.5,10 C206.5,30 199.5,50 203.5,70 C207.5,90 199.5,110 203.5,130 C207.5,150 199.5,170 203.5,190 C207.5,210 199.5,230 203.5,250 C207.5,270 202.5,280 202.5,287"
  fill="none" stroke="#7aabab" stroke-width="0.4" stroke-linecap="round" opacity="0.6"/>
<!-- Prickar vid vågkrön (right) -->
<use href="#wd"   transform="translate(205,70)"/>
<use href="#wd-s" transform="translate(202,50)"/>
<use href="#wd"   transform="translate(205,130)"/>
<use href="#wd-s" transform="translate(202,110)"/>
<use href="#wd"   transform="translate(205,190)"/>
<use href="#wd-s" transform="translate(202,170)"/>
<use href="#wd"   transform="translate(205,250)"/>
<use href="#wd-s" transform="translate(202,230)"/>

</svg>
