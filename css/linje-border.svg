<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297">
<!--
  LINJE — minimalistiska diagonala streck och diamanter
  Färgschema: warm gray/charcoal (#6a6a6a main, #9a9a9a lighter, #3a3a3a accents)
  Konvention: alla dekorationer inom 10mm från sidkanten.
  Korta sneda streck (regn/skraffering) vid jämna intervall, diamanter i hörnen.
-->
<defs>
  <!-- Kort diagonalt streck (/) -->
  <line id="sl" x1="0" y1="2.5" x2="2" y2="-2.5"
    stroke="#6a6a6a" stroke-width="0.5" stroke-linecap="round"/>
  <!-- Kort diagonalt streck, tunt (\) -->
  <line id="sl-r" x1="0" y1="-2.5" x2="2" y2="2.5"
    stroke="#9a9a9a" stroke-width="0.35" stroke-linecap="round"/>
  <!-- Diamant (hörndekoration) -->
  <polygon id="dia" points="0,-2.5 1.5,0 0,2.5 -1.5,0"
    fill="none" stroke="#3a3a3a" stroke-width="0.5"/>
  <!-- Liten diamant -->
  <polygon id="dia-s" points="0,-1.5 0.9,0 0,-1.5 -0.9,0"
    fill="#9a9a9a" opacity="0.4"/>
  <!-- Liten prick -->
  <circle id="ld" r="0.4" fill="#6a6a6a" opacity="0.5"/>
</defs>

<!-- TUNN BORDERRAM -->
<rect x="10" y="10" width="190" height="277"
  fill="none" stroke="#6a6a6a" stroke-width="0.5"/>

<!-- ═══════════════════════════════════════════
     HÖRNDIAMANTER
═══════════════════════════════════════════ -->
<use href="#dia" transform="translate(10,10) rotate(45)"/>
<use href="#dia" transform="translate(200,10) rotate(45)"/>
<use href="#dia" transform="translate(10,287) rotate(45)"/>
<use href="#dia" transform="translate(200,287) rotate(45)"/>

